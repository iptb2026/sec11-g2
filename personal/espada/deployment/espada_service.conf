[program:espada_service]
command=/home/admin/personal/espada/appserver/command-service.sh
directory=/home/admin/personal/espada/appserver
user=admin
autostart=true
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/home/admin/personal/espada/appserver/debug.log
stdout_logfile_maxbytes=250KB
stdout_logfile_backups=3
