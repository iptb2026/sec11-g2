<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Mini Banking System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .action {
            width: 100%;
            margin-top: 10px;
        }

        .logout {
            background: #333;
            color: white;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<header>
    <h2>Mini Banking System</h2>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <h1>Staff Dashboard</h1>

    <p>
        Welcome,
        <strong id="username">Staff</strong>
    </p>

    <div class="cards">

        <div class="card">
            <h3>Accounts</h3>
            <p>View customer bank accounts.</p>
            <button class="action" onclick="loadAccounts()">
                View Accounts
            </button>
        </div>

        <div class="card">
            <h3>Deposits</h3>
            <p>View deposit transactions.</p>
            <button class="action" onclick="loadDeposits()">
                View Deposits
            </button>
        </div>

        <div class="card">
            <h3>Withdrawals</h3>
            <p>View withdrawal transactions.</p>
            <button class="action" onclick="loadWithdrawals()">
                View Withdrawals
            </button>
        </div>

        <div class="card">
            <h3>Transfers</h3>
            <p>View internal transfer transactions.</p>
            <button class="action" onclick="loadTransfers()">
                View Transfers
            </button>
        </div>

    </div>

    <div id="results">
        Select an option above to view banking records.
    </div>

</div>

<script>

const API_URL = "http://localhost:5002";

const token = localStorage.getItem("access_token");
const username = localStorage.getItem("username");

if (!token) {
    window.location.href = "index.html";
} else {
    try {
        const payload = JSON.parse(atob(token.split(".")[1]));

        if (payload.role !== "STAFF") {
            localStorage.removeItem("access_token");
            localStorage.removeItem("username");
            window.location.href = "index.html";
        }
    } catch (error) {
        localStorage.removeItem("access_token");
        localStorage.removeItem("username");
        window.location.href = "index.html";
    }
}

document.getElementById("username").textContent =
    username || "Staff";


async function getData(endpoint) {

    const response = await fetch(API_URL + endpoint, {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (!response.ok) {
        throw new Error("Request failed");
    }

    return await response.json();
}


async function loadAccounts() {

    try {

        const accounts = await getData("/accounts/");

        let output = `
            <h2>Customer Accounts</h2>
            <table>
                <tr>
                    <th>Account</th>
                    <th>Balance</th>
                    <th>Currency</th>
                    <th>Status</th>
                </tr>
        `;

        accounts.forEach(account => {
            output += `
                <tr>
                    <td>${account.account_number}</td>
                    <td>${account.available_balance}</td>
                    <td>${account.currency_code}</td>
                    <td>${account.status}</td>
                </tr>
            `;
        });

        output += "</table>";

        document.getElementById("results").innerHTML = output;

    } catch (error) {

        document.getElementById("results").textContent =
            "Unable to load accounts.";
    }
}


async function loadDeposits() {

    try {

        const deposits = await getData("/deposits/");

        let output = "<h2>Deposit Transactions</h2>";

        if (deposits.length === 0) {
            output += "<p>No deposits found.</p>";
        } else {
            deposits.forEach(item => {
                output += `
                    <p>
                    Reference: ${item.reference_number}
                    | Amount: PHP ${item.amount}
                    | Status: ${item.status}
                    </p>
                `;
            });
        }

        document.getElementById("results").innerHTML = output;

    } catch (error) {

        document.getElementById("results").textContent =
            "Unable to load deposits.";
    }
}


async function loadWithdrawals() {

    try {

        const withdrawals = await getData("/withdrawals/");

        let output = "<h2>Withdrawal Transactions</h2>";

        if (withdrawals.length === 0) {
            output += "<p>No withdrawals found.</p>";
        } else {
            withdrawals.forEach(item => {
                output += `
                    <p>
                    Reference: ${item.reference_number}
                    | Amount: PHP ${item.amount}
                    | Status: ${item.status}
                    </p>
                `;
            });
        }

        document.getElementById("results").innerHTML = output;

    } catch (error) {

        document.getElementById("results").textContent =
            "Unable to load withdrawals.";
    }
}


async function loadTransfers() {

    try {

        const transfers = await getData("/transfers/");

        let output = "<h2>Transfer Transactions</h2>";

        if (transfers.length === 0) {
            output += "<p>No transfers found.</p>";
        } else {
            transfers.forEach(item => {
                output += `
                    <p>
                    Reference: ${item.transfer_reference}
                    | Amount: PHP ${item.amount}
                    | Status: ${item.status}
                    </p>
                `;
            });
        }

        document.getElementById("results").innerHTML = output;

    } catch (error) {

        document.getElementById("results").textContent =
            "Unable to load transfers.";
    }
}


async function logout() {

    try {

        await fetch(API_URL + "/auth/logout", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

    } catch (error) {
        console.log(error);
    }

    localStorage.removeItem("access_token");
    localStorage.removeItem("username");

    window.location.href = "index.html";
}

</script>

</body>
</html>
