services:
  database:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: evanoso
      MARIADB_USER: evanoso
      MARIADB_PASSWORD: "1234"
      MARIADB_ROOT_PASSWORD: "1234"
    volumes:
      - evanoso-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./appserver
    environment:
      DB_HOST: database
      DB_USER: evanoso
      DB_PASSWORD: "1234"
      DB_NAME: evanoso
      SECRET_KEY: local-classroom-demo-only-change-before-deployment
    depends_on:
      database:
        condition: service_healthy

  web:
    build: ./appserver/frontend
    ports:
      - "9000:80"
    depends_on:
      - backend

volumes:
  evanoso-data:
